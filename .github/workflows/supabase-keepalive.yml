name: Supabase Keep Alive

on:
  schedule:
    # 08:17 y 20:17 UTC todos los días
    - cron: "17 8,20 * * *"

  # Permite probarlo manualmente
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase database
        run: |
          response=$(curl --silent --show-error --fail \
            --request POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/monopolis_keepalive" \
            --header "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            --header "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            --header "Content-Type: application/json" \
            --data '{}')

          echo "Supabase response: $response"
